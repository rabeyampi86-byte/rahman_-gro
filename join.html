    <!-- LOGIN FORM -->
    <div class="join-form">

        <h2>Login Here</h2>

        <p class="join-intro">
            Login to your Rahman Agro member account.
        </p>

        <input type="email" id="loginEmail" placeholder="Enter E-mail Here">

        <input type="password" id="loginPassword" placeholder="Enter Password Here">

        <button class="join-login-btn" onclick="loginUser()">
            Login
        </button>

        <p id="loginMessage"></p>

        <p class="join-link">
            Don't have an account?<br>
            <a href="signin.html">Sign up here</a>
        </p>

        <p class="join-social-title">Login with</p>

<div class="join-social-icons">

    <a href="#" title="Facebook">
        <ion-icon name="logo-facebook"></ion-icon>
    </a>

    <a href="#" title="Instagram">
        <ion-icon name="logo-instagram"></ion-icon>
    </a>

    <a href="#" title="Google">
        <ion-icon name="logo-google"></ion-icon>
    </a>

    <a href="#" title="YouTube">
        <ion-icon name="logo-youtube"></ion-icon>
    </a>

</div>
    </div>

</div>
<script src="https://unpkg.com/ionicons@5.4.0/dist/ionicons/ionicons.js"></script>

<script>
function loginUser() {

    let email = document.getElementById("loginEmail").value.trim();
    let password = document.getElementById("loginPassword").value;

    if (email === "" || password === "") {
        document.getElementById("loginMessage").innerText =
            "Please enter your email and password.";
        return;
    }

    let savedUser = JSON.parse(localStorage.getItem("rahmanUser"));

    if (!savedUser) {
        document.getElementById("loginMessage").innerText =
            "No account found. Please sign up first.";
        return;
    }

    if (email === savedUser.email && password === savedUser.password) {

        localStorage.setItem("loggedIn", "true");

        window.location.href = "member.html";

    } else {

        document.getElementById("loginMessage").innerText =
            "Incorrect email or password.";

    }
}
</script>

<script src="js/main.js"></script>

</body>
</html>
